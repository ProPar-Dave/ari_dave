ontology_version: 1.0.0
last_updated: 2026-05-12
relationship_types:
  - relationship_id: REL-DEPENDS-ON
    description: >
      Artifact requires another artifact for correct operation or interpretation.

  - relationship_id: REL-SUPERSEDES
    description: >
      Artifact replaces another artifact while preserving lineage.

  - relationship_id: REL-GENERATED-BY
    description: >
      Artifact was generated by another artifact, workflow, or AI system.

  - relationship_id: REL-VALIDATED-BY
    description: >
      Artifact was operationally reviewed or verified by another artifact or process.

  - relationship_id: REL-CONSTRAINED-BY
    description: >
      Artifact behavior or meaning is governed by another artifact.
