projection_principles:
  - Governed entities may project into runtime systems.
  - Runtime behavior should remain explainable relative to governed intent.
  - Projection relationships should preserve trust and lineage visibility.
projection_types:
  - deployed-function
  - deployed-policy
  - deployed-schema
  - generated-ui
  - orchestration-runtime
